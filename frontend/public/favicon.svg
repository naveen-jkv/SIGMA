<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Glowing Water Drop -->
  <g filter="url(#glow)">
    <path d="M256 70 C256 70 380 220 380 326 C380 398 324 454 256 454 C188 454 132 398 132 326 C132 220 256 70 256 70 Z"
          fill="url(#dropGrad)"/>
  </g>

  <!-- Inner Diagnostic Pulse / Wave -->
  <path d="M176 330 L220 330 L236 280 L260 380 L280 310 L300 330 L336 330"
        fill="none"
        stroke="#ffffff"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Center AI Node Ping -->
  <circle cx="256" cy="230" r="10" fill="#ffffff"/>
  <circle cx="256" cy="230" r="18" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
</svg>
